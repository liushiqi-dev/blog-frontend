name: Deploy to Server

# 触发条件：push 到 main 分支时自动运行
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 把仓库代码拉到 GitHub 云机器
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 用 Secrets 里的账号密码登录阿里云镜像仓库
      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login --username "${{ secrets.ACR_USERNAME }}" --password-stdin ${{ secrets.ACR_REGISTRY }}

      # 3. 前端镜像：多阶段 Dockerfile 内部完成 npm ci + build
      - name: Build & push frontend image
        run: |
          docker build -t ${{ secrets.ACR_REGISTRY }}/blog-lsq/blog-frontend:latest .
          docker push ${{ secrets.ACR_REGISTRY }}/blog-lsq/blog-frontend:latest

      # 4. 通过 SSH 登录服务器，拉新镜像并重启（服务器不参与构建）
      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: 47.94.95.8
          username: root
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/my-blog-backend
            docker compose pull frontend
            docker compose up -d frontend
